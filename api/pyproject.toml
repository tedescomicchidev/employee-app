[project]
name = "employee-api"
version = "0.1.0"
description = "Employee App PoC API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.30,<1.31",
    "msal>=1.39.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
