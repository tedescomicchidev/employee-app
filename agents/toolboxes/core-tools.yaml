# Shared toolbox `core-tools` (overview.md section 5): one MCP endpoint in front of api/'s /mcp server.
# comms uses it now; vacation joins in its slice. Each agent's instructions limit it to its domain;
# the role checks in api/ are the real boundary. Referenced from azure.yaml.
description: Employee app tools served by api/ (acting as the calling user).
tools:
  - type: mcp
    server_label: employee-api
    server_url: ${AZURE_API_URL}/mcp
    connection: tools-conn
    # Writes are guarded by the confirmation_token from the app's confirm card (FR-AUTH-006),
    # which a model-side approval prompt cannot replace.
    require_approval: never
