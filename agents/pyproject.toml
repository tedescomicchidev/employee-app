[project]
name = "employee-agents"
version = "0.1.0"
description = "Foundry hosted agents (Phase 6+)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-foundry==1.15.0",
    "agent-framework-foundry-hosting==1.0.0b261015",
    "azure-identity>=1.26.0",
    "pydantic>=2.14.1",
    "starlette>=0.40",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mcp>=1.30", "uvicorn>=0.32", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["comms", "vacation", "briefing"]

[tool.ruff]
line-length = 100
target-version = "py312"
