# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: employee-app
infra:
  provider: bicep
  path: infra
  module: main
services:
  api:
    project: ./api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: false
  # Foundry project created by infra/ (modules/foundry.bicep); connect, do not recreate.
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  comms:
    host: azure.ai.agent
    project: ./agents/comms
    language: python
    kind: hosted
    name: comms
    description: Announcements assistant (FR-ANN-001..005 AGENT). Acts only through api/ MCP tools.
    # Source-code deploy: azd zips agents/comms and Foundry installs requirements.txt remotely.
    # No Docker, no ACR build, and the upload is a few KB.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py  # a single file name here; azd combines it with the runtime
      dependencyResolution: remote_build
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # The agent calls api/'s MCP server itself with the token api/ forwards on each turn (ADR-002).
      # No toolbox: a UserEntraToken connection needs a user token for Foundry, which api/ does not hold.
      API_MCP_URL: ${AZURE_API_URL}/mcp
      COMMS_INSTRUCTIONS_VERSION: v1
    startupCommand: python main.py
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
