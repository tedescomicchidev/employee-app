name: EmployeeApp
options:
  bundleIdPrefix: ch.example   # HUMAN: replace <retailer> (ch.<retailer>.employee)
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 2.16.0
  Core:
    path: Packages/Core
  Features:
    path: Packages/Features
targets:
  EmployeeApp:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleLocalizations: [en, de, fr, it]
        EntraClientID: $(ENTRA_CLIENT_ID)
        EntraTenantID: $(ENTRA_TENANT_ID)
        ApiClientID: $(API_CLIENT_ID)
        ApiBaseURL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["msauth.$(PRODUCT_BUNDLE_IDENTIFIER)"]
        LSApplicationQueriesSchemes: [msauthv2, msauthv3]
    entitlements:
      path: App/EmployeeApp.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.microsoft.adalcache"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Employee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Core
      - package: Features
      - package: MSAL
        product: MSAL
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
    dependencies:
      - target: EmployeeApp
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
    dependencies:
      - target: EmployeeApp
schemes:
  EmployeeApp:
    build:
      targets:
        EmployeeApp: all
    test:
      targets: [AppTests, AppUITests]
