name: EmployeeApp
options:
  bundleIdPrefix: ch.example   # HUMAN: replace <retailer> (ch.<retailer>.employee)
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO   # agent account has no signing identity; human signs
packages:
  Core:
    path: Packages/Core
  Features:
    path: Packages/Features
targets:
  EmployeeApp:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.example.employee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Employee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Core
      - package: Features
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.example.employee.tests
    dependencies:
      - target: EmployeeApp
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.example.employee.uitests
    dependencies:
      - target: EmployeeApp
schemes:
  EmployeeApp:
    build:
      targets:
        EmployeeApp: all
    test:
      targets: [AppTests, AppUITests]
